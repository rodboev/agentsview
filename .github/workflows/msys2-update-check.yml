name: MSYS2 retry probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retry:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Leave a failed installation
        id: first
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: no-such-package
          path-type: inherit

      - name: Reproduce the original retry failure
        id: baseline
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Confirm both original attempts failed
        shell: pwsh
        env:
          FIRST_OUTCOME: ${{ steps.first.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        run: |
          if ($env:FIRST_OUTCOME -ne 'failure' -or $env:BASELINE_OUTCOME -ne 'failure') {
            throw 'Both original attempts must fail before testing the repaired retry.'
          }

      - name: Retry in a fresh location
        uses: msys2/setup-msys2@v2.33.0
        with:
          location: ${{ runner.temp }}/msys2-retry
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Use the repaired installation
        shell: msys2 {0}
        run: gcc --version
