name: MSYS2 runner retry probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retry:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Leave a failed installation
        id: first
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: no-such-package
          path-type: inherit

      - name: Confirm the first attempt failed
        shell: pwsh
        env:
          FIRST_OUTCOME: ${{ steps.first.outcome }}
        run: |
          if ($env:FIRST_OUTCOME -ne 'failure') {
            throw 'The first attempt must fail before testing the retry.'
          }

      - name: Retry using the runner installation
        uses: msys2/setup-msys2@v2.33.0
        with:
          release: false
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Use the repaired installation
        shell: msys2 {0}
        run: gcc --version
