name: Append growth proof

on:
  workflow_call:

permissions:
  contents: read

env:
  GOTRACEBACK: all
  GOPROXY: "https://proxy.golang.org|direct"
  GOFLAGS: -trimpath
  CGO_ENABLED: "1"
  PROOF_SHA: 680b19e0672aa111409e1bdf2a8d1d99be287f9a

jobs:
  append-growth:
    name: Append growth (${{ matrix.lane }}, 20 runs)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux
            os: ubuntu-latest
          - lane: windows
            os: windows-latest
          - lane: race
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PROOF_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Windows Go paths
        uses: $/.github/actions/windows-go-paths

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          group: ${{ matrix.lane == 'race' && 'race-linux' || format('test-{0}-{1}', runner.os, runner.arch) }}

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.5

      - name: Prepare SQLite header
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"

      - name: Setup MinGW
        if: runner.os == 'Windows'
        id: setup_mingw
        continue-on-error: true
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Setup MinGW (retry on transient failure)
        if: runner.os == 'Windows' && steps.setup_mingw.outcome == 'failure'
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Restore pricing snapshot
        shell: bash
        run: kit-retry 3 5 go run ./internal/pricing/cmd/litellm-snapshot -restore

      - name: Run 20 consecutive checks without retries
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          test "$(git rev-parse HEAD)" = "$PROOF_SHA"
          mkdir -p gotestsum
          git rev-parse HEAD > gotestsum/source-sha.txt
          extra=()
          if [ "$LANE" = race ]; then extra=(-race -p 4); fi
          for iteration in $(seq 1 20); do
            prefix="gotestsum/${LANE}-${iteration}"
            go tool gotestsum --format pkgname-and-test-fails --format-icons text --jsonfile "${prefix}.json" --rerun-fails=0 --rerun-fails-report "${prefix}-reruns.txt" --packages ./cmd/perfsim -- -tags fts5 "${extra[@]}" -run '^TestActiveAppendGrowth$' -count=1 -timeout=20m 2>&1 | tee "${prefix}.log"
          done

      - name: Verify all 20 records
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lane = os.environ["LANE"]
          for iteration in range(1, 21):
              prefix = Path("gotestsum") / f"{lane}-{iteration}"
              events = [json.loads(line) for line in prefix.with_suffix(".json").read_text().splitlines()]
              failures = [event for event in events if event["Action"] == "fail"]
              passes = [event for event in events if event["Action"] == "pass" and event.get("Test") == "TestActiveAppendGrowth"]
              assert not failures, f"{prefix}: failure recorded"
              assert len(passes) == 1, f"{prefix}: expected exactly one growth-check pass"
              reruns = prefix.with_name(prefix.name + "-reruns.txt")
              assert not reruns.exists() or not reruns.read_text().strip(), f"{prefix}: rerun recorded"
          print(f"{lane}: 20 consecutive passes with no failures or reruns")
          PY

      - name: Upload every result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: append-growth-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: gotestsum/
          retention-days: 14
          if-no-files-found: warn
